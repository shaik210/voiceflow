services:
  postgres:
    image: postgres:16-alpine
    container_name: voiceflow-postgres
    restart: always
    environment:
      POSTGRES_USER: voiceflow
      POSTGRES_PASSWORD: voiceflow_secret
      POSTGRES_DB: voiceflow_db
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceflow -d voiceflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voiceflow-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: voiceflow-minio
    restart: always
    environment:
      MINIO_ROOT_USER: voiceflow_minio_user
      MINIO_ROOT_PASSWORD: voiceflow_minio_password
    ports:
      - "9005:9000"
      - "9006:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
